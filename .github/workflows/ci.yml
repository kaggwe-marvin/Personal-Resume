on: push
name: Build and deploy GH Pages
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: checkout
        uses: actions/checkout@v4
      # Penzi lives in its own repo; copy its latest version in so it is served at /penzi
      - name: Add Penzi
        run: |
          git clone --depth 1 https://github.com/kaggwe-marvin/penzi /tmp/penzi
          rm -rf /tmp/penzi/.git /tmp/penzi/README.md
          cp -r /tmp/penzi static/penzi
      - name: build_and_deploy
        uses: shalzz/zola-deploy-action@master
        env:
          # Target branch
          PAGES_BRANCH: gh-pages
          # Or if publishing to the same repo, use the automatic token
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tell Bing, Yandex and other IndexNow search engines which pages exist,
  # so new and changed pages are crawled quickly.
  indexnow:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SITE: https://resume.kaggwemarvinvictor.me
      KEY: 9065fbaa5348b0336100a6653d0178b1
    steps:
      - name: Wait for GitHub Pages to publish
        run: sleep 120
      - name: Submit sitemap URLs to IndexNow
        run: |
          urls=$(curl -fsSL "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          body=$(jq -n -c --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --argjson urls "$urls" \
            '{host: "resume.kaggwemarvinvictor.me", key: $key, keyLocation: $loc, urlList: $urls}')
          echo "$body"
          curl -sS -o /dev/null -w "IndexNow response: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" -d "$body"
